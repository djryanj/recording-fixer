[workspace]
resolver = "2"
members = ["crates/aiff-core", "crates/dynamics", "crates/edit-core", "crates/export", "crates/library", "crates/peaks", "crates/playback", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/djryanj/recording-fixer"

[workspace.dependencies]
thiserror = "2"
tempfile = "3"
aiff-core = { path = "crates/aiff-core" }
edit-core = { path = "crates/edit-core" }
export = { path = "crates/export" }
dynamics = { path = "crates/dynamics" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The audio crates do per-sample work over hours of audio; unoptimised, measuring the loudness of a
# 3 h recording took 5 minutes in a development build (13 s optimised). Keep them fast in dev builds
# and tests, and leave the rest (tauri and friends) quick to compile.
[profile.dev.package.aiff-core]
opt-level = 3
[profile.dev.package.dynamics]
opt-level = 3
[profile.dev.package.edit-core]
opt-level = 3
[profile.dev.package.peaks]
opt-level = 3
[profile.dev.package.playback]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
