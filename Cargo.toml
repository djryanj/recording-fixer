[workspace]
resolver = "2"
members = ["crates/aiff-core", "crates/edit-core", "crates/export", "crates/library", "crates/peaks", "crates/playback", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/djryanj/recording-fixer"

[workspace.dependencies]
thiserror = "2"
tempfile = "3"
aiff-core = { path = "crates/aiff-core" }
edit-core = { path = "crates/edit-core" }
export = { path = "crates/export" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
