name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Nothing here writes to the repo, so the token gets read-only access whatever the repo default is.
permissions:
  contents: read

jobs:
  # Docs-only changes skip the expensive builds. This is done with job conditions, not
  # `paths-ignore`, because a workflow that never starts leaves required checks pending forever.
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Pushes to main always get the full run.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              *.md | docs/* | LICENSE | .github/rulesets/* | .github/ISSUE_TEMPLATE/* | .github/pull_request_template.md | .github/dependabot.yml) ;;
              *) echo "code change: $file"; code=true ;;
            esac
          done < <(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          echo "code=$code" >> "$GITHUB_OUTPUT"

  deny:
    name: Dependency policy (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check advisories bans licenses sources

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # ASIO (Windows) needs LLVM and pulls in Steinberg's SDK. macOS builds leave it out.
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress

      - name: UI dependencies
        run: npm --prefix ui ci
      - name: UI type check
        run: npm --prefix ui run check
      - name: UI tests (logic + components)
        run: npm --prefix ui test

      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lints (Windows, with ASIO)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      - name: Rust lints (macOS, without ASIO)
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Rust tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      - name: Rust tests (macOS, without ASIO)
        if: runner.os == 'macOS'
        run: cargo test --workspace --no-default-features

  e2e:
    name: End-to-end (Windows, real app)
    runs-on: windows-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tools
        run: |
          choco install ffmpeg llvm -y --no-progress
          cargo install tauri-cli --version "^2" --locked
          cargo install tauri-driver --locked
          npm --prefix ui ci
      - name: Matching Edge WebDriver
        shell: pwsh
        run: |
          # The driver must match the runtime the app actually loads: prefer the installed folder, fall back to the registry.
          $dir = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^\d+\.' } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $v = if ($dir) { $dir.Name } else { (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv }
          Write-Host "WebView2 runtime $v"
          New-Item -ItemType Directory -Force ui/e2e/.tools | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile ui/e2e/.tools/edgedriver.zip
          Expand-Archive ui/e2e/.tools/edgedriver.zip ui/e2e/.tools/edgedriver -Force
      - name: Build the app
        run: cargo tauri build --debug --no-bundle
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      - name: Pre-flight (app and WebView2 start)
        shell: pwsh
        run: ./ui/e2e/smoke.ps1
      - name: Drive it
        run: npm --prefix ui run e2e
      - name: Keep driver logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ui/e2e/.tools/logs/
          if-no-files-found: ignore

  # The one check the branch ruleset requires. Skipped jobs (docs-only changes) count as passing;
  # a failed or cancelled one does not. Requiring this instead of each job also avoids the
  # unexpanded "Test (${{ matrix.os }})" name a skipped matrix job would report.
  ci:
    name: CI result
    if: always()
    needs: [changes, deny, test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
